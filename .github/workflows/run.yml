name: YouTube Analytics Auto Collector

on:
  schedule:
    # 毎日 日本時間 午前8:00 (UTC 23:00) に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth playwright
          playwright install chromium

      - name: Cookieファイルの作成
        run: |
          cat << 'EOF' > youtube_cookies.json
          ${{ secrets.YOUTUBE_COOKIES }}
          EOF

      - name: 自動取得プログラムの実行
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: python main.py
